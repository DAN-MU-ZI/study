name: stackoverflow-db-lab

services:
  extractor:
    build:
      context: ./extractor
    profiles: ["tools"]
    volumes:
      - ./StackOverflow2010.7z:/input/StackOverflow2010.7z:ro
      - ./data/sqlserver:/output

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["migration", "tools"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 3072
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./data/sqlserver:/source:ro
      - ./migration:/migration:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
    ports:
      - "54320:5432"
    shm_size: 1gb
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./migration:/migration:ro
      - ./observability:/observability:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrator:
    image: ghcr.io/dimitri/pgloader:latest
    profiles: ["tools"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migration:/migration:ro
    entrypoint: ["/bin/sh", "/migration/migrate.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
    profiles: ["app"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/stackoverflow_lab
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    environment:
      BASE_URL: http://api:8080
      TAG: ${LOAD_TAG:-java}
      VUS: ${LOAD_VUS:-20}
      DURATION: ${LOAD_DURATION:-30s}
    volumes:
      - ./load:/scripts:ro
    command: ["run", "/scripts/search-posts.js"]
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver-data:
  postgres-data:
